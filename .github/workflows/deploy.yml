name: Build and Deploy Scrappy

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: scrappy-production
  cancel-in-progress: true

jobs:
  build-images:
    runs-on: ubuntu-latest
    environment: build and deploy

    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify frontend production configuration
        run: |
          set -euo pipefail
          test -s frontend/.env.production
          grep -Eq '^VITE_SCRAPPYS_SCRAPYARD_URL=https?://[^[:space:]]+$' frontend/.env.production

      - name: Set image names
        id: images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME"
          {
            printf 'backend_image=%s/scrappys-scrapyard:%s\n' "$DOCKERHUB_USERNAME" "${GITHUB_SHA}"
            printf 'frontend_image=%s/scrappys-house:%s\n' "$DOCKERHUB_USERNAME" "${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/scrappys-scrapyard:latest
            ${{ steps.images.outputs.backend_image }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/scrappys-house:latest
            ${{ steps.images.outputs.frontend_image }}

  deploy:
    needs: build-images
    runs-on: ubuntu-latest
    environment: build and deploy

    steps:
      - name: Connect GitHub Actions to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.SERVER_HOST }}

      - name: Verify Tailscale SSH reachability
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          : "${SERVER_HOST:?SERVER_HOST secret is required}"
          tailscale status
          tailscale ping "$SERVER_HOST"
          timeout 10 bash -c "</dev/tcp/${SERVER_HOST}/22"

      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1.2.0
        env:
          SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          protocol: tcp4
          timeout: 1m
          envs: SERVER_APP_DIR
          script: |
            set -eu
            : "${SERVER_APP_DIR:?SERVER_APP_DIR secret is required}"
            if ! mkdir -p "$SERVER_APP_DIR/postgres/init"; then
              echo "Unable to create $SERVER_APP_DIR/postgres/init; check the path and SSH user permissions" >&2
              exit 1
            fi
            echo "Deployment directory is ready"

      - name: Deploy Compose stack over Tailscale
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          protocol: tcp4
          timeout: 1m
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,SERVER_APP_DIR,IMAGE_TAG
          script: |
            set -eu
            : "${SERVER_APP_DIR:?SERVER_APP_DIR secret is required}"
            : "${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME secret is required}"
            : "${DOCKERHUB_TOKEN:?DOCKERHUB_TOKEN secret is required}"
            : "${IMAGE_TAG:?GitHub commit tag is required}"

            cd "$SERVER_APP_DIR"

            for required_file in .env backend/.env frontend/.env; do
              if [ ! -f "$required_file" ]; then
                echo "Missing required environment file: $SERVER_APP_DIR/$required_file" >&2
                exit 1
              fi
            done
            echo "Existing environment files are present"

            cat > docker-compose.production.yaml <<'COMPOSE'
            services:
              frontend:
                image: ${SCRAPPY_FRONTEND_IMAGE}
                ports:
                  - "5175:8000"
                env_file:
                  - ./frontend/.env
                restart: unless-stopped

              backend:
                image: ${SCRAPPY_BACKEND_IMAGE}
                working_dir: /app
                command: python -m uvicorn main:app --host 0.0.0.0 --port 8000
                env_file:
                  - ./backend/.env
                ports:
                  - "8010:8000"
                depends_on:
                  postgres:
                    condition: service_healthy
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
                  interval: 10s
                  timeout: 5s
                  retries: 3
                restart: unless-stopped

              postgres:
                image: pgvector/pgvector:pg17
                ports:
                  - "5444:5432"
                environment:
                  POSTGRES_USER: ${POSTGRES_MAIN_USER}
                  POSTGRES_PASSWORD: ${POSTGRES_MAIN_PASSWORD}
                  POSTGRES_DB: ${POSTGRES_MAIN_DB}
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_MAIN_USER} -d ${POSTGRES_MAIN_DB}"]
                  interval: 5s
                  timeout: 5s
                  retries: 5
                  start_period: 5s
                restart: unless-stopped
                volumes:
                  - postgres_data_scrappys_metadata:/var/lib/postgresql/data
                  - ./postgres/init:/docker-entrypoint-initdb.d
                env_file:
                  - .env

              db-cache:
                image: redis:7.4-alpine
                ports:
                  - "6380:6379"
                volumes:
                  - db_redis_cache_scrappys_cache:/var/lib/redis
                command: ["redis-server", "--save", "", "--appendonly", "no"]
                healthcheck:
                  test: ["CMD", "redis-cli", "ping"]
                  interval: 10s
                  timeout: 5s
                  retries: 3
                restart: unless-stopped

            volumes:
              db_redis_cache_scrappys_cache:
              postgres_data_scrappys_metadata:
            COMPOSE

            printf '%s' "$DOCKERHUB_TOKEN" | docker login \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin

            SCRAPPY_BACKEND_IMAGE="${DOCKERHUB_USERNAME}/scrappys-scrapyard:${IMAGE_TAG}"
            SCRAPPY_FRONTEND_IMAGE="${DOCKERHUB_USERNAME}/scrappys-house:${IMAGE_TAG}"
            export SCRAPPY_BACKEND_IMAGE SCRAPPY_FRONTEND_IMAGE
            COMPOSE_FILES="-f docker-compose.production.yaml"
            echo "Validating Compose configuration"
            docker compose $COMPOSE_FILES config --quiet
            echo "Pulling deployment images"
            docker compose $COMPOSE_FILES pull
            echo "Starting Scrappy services"
            docker compose $COMPOSE_FILES up -d --no-build --remove-orphans
            for attempt in $(seq 1 30); do
              if docker compose $COMPOSE_FILES exec -T backend curl --fail --silent --show-error \
                http://localhost:8000/api/v1/health; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Backend health check did not pass after 60 seconds" >&2
                exit 1
              fi
              sleep 2
            done
            docker compose $COMPOSE_FILES ps
