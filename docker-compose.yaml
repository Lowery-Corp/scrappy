services:
  scrappys-house:
    build:
      context: ./scrappysHouse
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./scrappysHouse:/app
      - /app/node_modules
    env_file:
      - ./scrappysHouse/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true